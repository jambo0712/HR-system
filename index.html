<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>薪資保險人事系統</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 登入畫面 -->
  <section id="loginView" class="login" hidden>
    <form id="loginForm" class="card login-card">
      <img src="images/logo.svg" alt="" width="56" height="56">
      <h1>薪資保險人事系統</h1>
      <p class="muted">請登入後使用</p>
      <label>Email
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label>密碼
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="btn primary" type="submit">登入</button>
      <p id="loginError" class="error" role="alert"></p>
    </form>
  </section>

  <!-- 主系統 -->
  <div id="app" hidden>
    <header class="topbar">
      <a class="brand" href="#/"><img src="images/logo.svg" alt="" width="28" height="28"><span>薪資保險人事</span></a>
      <nav id="nav">
        <a href="#/" data-r="home">總覽</a>
        <a href="#/employees" data-r="employees">員工</a>
        <a href="#/payroll" data-r="payroll">薪資試算</a>
        <a href="#/payslips" data-r="payslips">薪資單</a>
        <a href="#/service" data-r="service">勞務報酬</a>
        <a href="#/settings" data-r="settings">設定</a>
      </nav>
      <button id="logoutBtn" class="btn small">登出</button>
    </header>
    <main id="view" class="container"></main>
  </div>

  <!-- 薪資單（列印用） -->
  <div id="slipOverlay" class="overlay" hidden></div>

  <dialog id="dlg"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
